<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b4d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="棚卸カウンター"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>棚卸しカウンター</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#16243a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:650px;margin:auto;padding:16px 14px 32px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:1.25rem;margin:6px 0 16px}.card{background:#fff;border:1px solid #dce3ec;border-radius:16px;padding:13px;margin-bottom:12px;box-shadow:0 2px 9px #16243a0a}.card.active{border:2px solid #2466d1;background:#eef5ff}.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.name{font:inherit;font-weight:650;font-size:1rem;border:1px solid #c9d3df;border-radius:8px;padding:9px;width:100%;min-width:0}.number{font-size:2.25rem;font-weight:750;font-variant-numeric:tabular-nums;min-width:60px;text-align:right}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{font:inherit;cursor:pointer;border:1px solid #c9d3df;border-radius:10px;background:#fff;color:#1d3457;padding:10px;min-height:43px;font-weight:650;touch-action:manipulation}button.primary{background:#205fc3;color:white;border-color:#205fc3;font-size:1.25rem;min-height:62px}button:active{filter:brightness(.88);transform:scale(.98)}button:focus-visible,input:focus-visible{outline:3px solid #e5a735;outline-offset:2px}.small{font-size:.85rem}.muted{color:#63748b;font-size:.83rem}.foot{display:flex;justify-content:space-between;gap:8px;margin-top:9px;align-items:center}.total{display:flex;justify-content:space-between;align-items:center;font-size:1.2rem;font-weight:750}.total strong{font-size:2rem}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{min-height:18px;color:#186046;font-size:.82rem;margin:7px 0}.danger{color:#b22d34}.remove{border:0;background:transparent;min-height:34px;padding:5px 8px}.topbtn{font-size:.85rem}footer{margin-top:16px;font-size:.78rem;color:#617086;line-height:1.6}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#183456;color:white;padding:10px 16px;border-radius:10px;display:none;max-width:90%;text-align:center} @media(min-width:520px){.wrap{padding-top:24px}}
</style></head><body><main class="wrap"><header><h1>📦 棚卸しカウンター</h1><button id="undo" class="topbtn">↶ 取り消し</button></header><div id="items"></div><button id="add" style="width:100%;margin-bottom:12px">＋ 種類を追加（最大10）</button><section class="card total"><span>合計数量</span><strong id="total">0</strong></section><div class="toolbar"><button id="reset">全リセット</button><button id="csv">CSV書き出し</button><button id="copy">結果コピー</button><button id="backup">バックアップ保存</button><button id="restore">バックアップ読込</button><button id="install" hidden>アプリを追加</button></div><input type="file" id="restoreFile" accept="application/json,.json" hidden><p id="status" class="status" role="status" aria-live="polite"></p><footer>数値と項目名はこの端末のブラウザ内に自動保存されます。ブラウザのデータ消去や端末の故障に備えてCSV・バックアップを保存してください。端末間の自動同期はありません。</footer></main><div id="toast" role="status"></div><script>
(()=>{'use strict';const KEY='inventory-counter-v1',MAX=10;let next=4,items=[{id:1,name:'種類A',count:0},{id:2,name:'種類B',count:0},{id:3,name:'種類C',count:0}],history=[],active=null,deferredPrompt=null;const $=s=>document.querySelector(s);const clone=a=>a.map(x=>({...x}));function valid(a){return Array.isArray(a)&&a.length>0&&a.length<=MAX&&a.every(x=>Number.isSafeInteger(x.id)&&x.id>0&&typeof x.name==='string'&&x.name.length<=100&&Number.isSafeInteger(x.count)&&x.count>=0)}function load(){try{const data=JSON.parse(localStorage.getItem(KEY));if(data&&valid(data.items)&&new Set(data.items.map(x=>x.id)).size===data.items.length){items=data.items;next=Math.max(...items.map(x=>x.id))+1}}catch(e){message('保存データを読み込めませんでした')}}function save(){try{localStorage.setItem(KEY,JSON.stringify({items})) ;$('#status').textContent='端末に保存済み'}catch(e){$('#status').textContent='保存に失敗しました。CSVを出力してください'}}function message(s){const el=$('#toast');el.textContent=s;el.style.display='block';clearTimeout(message.t);message.t=setTimeout(()=>el.style.display='none',2000)}function snapshot(){history.push(clone(items));if(history.length>100)history.shift()}function change(id,delta){const it=items.find(x=>x.id===id);if(!it)return;const v=Math.max(0,it.count+delta);if(!Number.isSafeInteger(v))return message('数値が大きすぎます');snapshot();it.count=v;active=id;save();render();message(`${it.name} ${delta>0?'+':''}${delta} → ${v}`)}function render(){const root=$('#items');root.replaceChildren();for(const it of items){const card=document.createElement('section');card.className='card'+(it.id===active?' active':'');const head=document.createElement('div');head.className='head';const name=document.createElement('input');name.className='name';name.value=it.name;name.maxLength=100;name.setAttribute('aria-label','種類の名前');name.addEventListener('input',()=>{it.name=name.value;save()});const num=document.createElement('span');num.className='number';num.textContent=it.count;head.append(name,num);if(items.length>1){const rm=document.createElement('button');rm.className='remove danger';rm.textContent='✕';rm.setAttribute('aria-label',`${it.name}を削除`);rm.onclick=()=>{if(!confirm(`「${it.name}」を削除しますか？`))return;snapshot();items=items.filter(x=>x.id!==it.id);active=null;save();render()};head.append(rm)}card.append(head);const buttons=document.createElement('div');buttons.className='buttons';for(const delta of [1,5,10]){const b=document.createElement('button');b.className='primary';b.textContent=`+${delta}`;b.onclick=()=>change(it.id,delta);buttons.append(b)}card.append(buttons);const foot=document.createElement('div');foot.className='foot';const label=document.createElement('span');label.className='muted';label.textContent=it.id===active?'✓ 直前に操作した種類':'';foot.append(label);for(const delta of [-1,-5]){const b=document.createElement('button');b.className='small';b.textContent=String(delta);b.onclick=()=>change(it.id,delta);foot.append(b)}card.append(foot);root.append(card)}$('#total').textContent=items.reduce((s,x)=>s+x.count,0).toLocaleString('ja-JP');$('#add').disabled=items.length>=MAX;$('#undo').disabled=!history.length}function download(text,name,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function csvCell(s){return '"'+String(s).replaceAll('"','""')+'"'}function rows(){return items.map(x=>[x.name,x.count])}function date(){return new Date().toLocaleDateString('sv-SE')}$('#add').onclick=()=>{if(items.length>=MAX)return;snapshot();items.push({id:next++,name:`種類${items.length+1}`,count:0});active=null;save();render()};$('#undo').onclick=()=>{if(!history.length)return;items=history.pop();next=Math.max(next,...items.map(x=>x.id+1));active=null;save();render()};$('#reset').onclick=()=>{if(!confirm('すべての数量を0に戻しますか？'))return;snapshot();items.forEach(x=>x.count=0);active=null;save();render()};$('#csv').onclick=()=>{const csv='\ufeff'+[['種類','数量'],...rows(),['合計',items.reduce((s,x)=>s+x.count,0)]].map(r=>r.map(csvCell).join(',')).join('\r\n');download(csv,`棚卸し_${date()}.csv`,'text/csv;charset=utf-8');message('CSVを出力しました')};$('#copy').onclick=async()=>{const text=[...rows(),['合計',items.reduce((s,x)=>s+x.count,0)]].map(r=>r.join('\t')).join('\n');try{await navigator.clipboard.writeText(text);message('コピーしました')}catch(e){message('コピーできませんでした。CSVをご利用ください')}};$('#backup').onclick=()=>{download(JSON.stringify({version:1,items},null,2),`棚卸し_バックアップ_${date()}.json`,'application/json');message('バックアップを出力しました')};$('#restore').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!valid(data.items)||new Set(data.items.map(x=>x.id)).size!==data.items.length)throw Error();if(!confirm('現在のカウントをバックアップ内容で置き換えますか？'))return;snapshot();items=clone(data.items);next=Math.max(next,...items.map(x=>x.id+1));active=null;save();render();message('復元しました')}catch(e){message('正しいバックアップファイルではありません')}finally{e.target.value=''}};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#install').hidden=false});$('#install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;$('#install').hidden=true}};load();render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script></body></html>
